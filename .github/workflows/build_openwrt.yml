name: build-openwrt-sdk

# OpenWrt 产物：官方 SDK 24.10 编 ipk（对齐 mynet_gnb/build_openwrt.yml + 0.32 本地 SDK 用法）
#
# 交付形态：opkg 用的 ipk —— 不是 linux tgz
#   luci-app-mynet_*.ipk   Lua 壳（all）
#   mynet-agent_*_*.ipk    mynetd + mynet（架构相关；mynetd 瘦，无 embed）
#
# Go 侧 CGO_ENABLED=0 静态编译（musl 运行时可跑）；ipk 元数据/架构由 SDK 打出。

# ⚠️ 触发面：**只 tag + 手动**，不跟 push:main。
# 理由：本工作流是 3 腿 SDK 矩阵（每腿 ~3-4 分钟），而 GitHub Artifact 存储配额
# 已耗尽（upload-artifact 报 "Artifact storage quota has been hit"），push:main
# 触发的每次运行都**只烧分钟、拿不到产物**（红）。出包按需跑。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      openwrt_ref:
        description: "mynet_openwrt 的 git ref（tag/branch/sha）；留空用该仓默认分支"
        required: false
        default: ""

env:
  SDK_VERSION: "24.10.0"
  SDK_GCC: "13.3.0"

jobs:
  ipk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 192.168.0.2 = ImmortalWrt 24.10 x86_64 → x86/64
          - { arch: amd64,  goarch: amd64,  sdk_target: x86/64,        sdk_name: x86-64,        sdk_libc: musl }
          - { arch: arm64,  goarch: arm64,  sdk_target: armsr/armv8,   sdk_name: armsr-armv8,   sdk_libc: musl }
          - { arch: mipsel, goarch: mipsle, sdk_target: ramips/mt7621, sdk_name: ramips-mt7621, sdk_libc: musl, gomips: softfloat }
    steps:
      - uses: actions/checkout@v4
        with:
          # 全历史：PKG_RELEASE 用提交计数（单调递增，且同一提交可复现）。
          fetch-depth: 0

      # 包树在 mynet_openwrt（私有）—— 用建仓账号 token（repo secret GH_PAT）。
      # ⚠️ 仓名不带 -V2：2026-10 已去掉迁移期后缀（旧的 -V2 名靠 GitHub 重定向才不炸）。
      # ref 留空=默认分支；workflow_dispatch 可 pin 具体 SHA/tag（O6：禁浮动 HEAD）。
      - uses: actions/checkout@v4
        with:
          repository: mynet-club/mynet_openwrt
          path: mynet_openwrt
          ref: ${{ inputs.openwrt_ref }}
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Resolve version
        id: ver
        run: |
          # 版本必须**同时**反映两个仓：产物 = agent 的 Go 二进制 + openwrt 仓的
          # LuCI/脚本/postinst。只看 agent 的 sha 时，openwrt 仓单独改动不改版本
          # ⇒ 发布探针判「已在下载面」而 SKIP —— 修了却不发，下载面静默停在旧件
          # （2026-10-11 实测：luci postinst 的修复被 SKIP 掉）。
          # ⚠️ 不要用 `git describe`：全历史下会给 v0.1.2-20-g<sha>（两个连字符），
          # ctl 的 validateVersion 只允许一个 [.\-] 后缀段 ⇒ 500。
          OW=$(git -C "$GITHUB_WORKSPACE/mynet_openwrt" rev-parse --short HEAD)
          TAG=$(git tag --points-at HEAD | head -1)
          if [ -n "$TAG" ]; then
            V="$TAG"
          else
            V="v0.0.0-$(git rev-parse --short HEAD).$OW"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential wget zstd file

      - name: Cache OpenWrt SDK
        id: sdk_cache
        uses: actions/cache@v4
        with:
          path: /opt/openwrt-sdk/${{ env.SDK_VERSION }}/${{ matrix.sdk_name }}
          key: openwrt-sdk-${{ env.SDK_VERSION }}-${{ matrix.sdk_name }}-gcc${{ env.SDK_GCC }}-v1

      - name: Download OpenWrt SDK
        if: steps.sdk_cache.outputs.cache-hit != 'true'
        run: |
          SDK_FILE="openwrt-sdk-${{ env.SDK_VERSION }}-${{ matrix.sdk_name }}_gcc-${{ env.SDK_GCC }}_${{ matrix.sdk_libc }}.Linux-x86_64.tar.zst"
          SDK_URL="https://downloads.openwrt.org/releases/${{ env.SDK_VERSION }}/targets/${{ matrix.sdk_target }}/${SDK_FILE}"
          echo "Downloading $SDK_URL"
          wget -q -O /tmp/sdk.tar.zst "$SDK_URL"
          mkdir -p /opt/openwrt-sdk/${{ env.SDK_VERSION }}
          cd /opt/openwrt-sdk/${{ env.SDK_VERSION }}
          tar --use-compress-program=unzstd -xf /tmp/sdk.tar.zst
          EXTRACTED=$(ls -d openwrt-sdk-* | head -1)
          mv "$EXTRACTED" "${{ matrix.sdk_name }}"

      - name: Build Go binaries
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOMIPS: ${{ matrix.gomips }}
          CGO_ENABLED: '0'
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          LDFLAGS="-s -w -X github.com/mynet-club/mynet_agent/shared/utils.AppVersion=${VER} -X github.com/mynet-club/mynet_agent/mynet.Version=${VER} -X main.version=${VER}"
          PKG=mynet_openwrt
          mkdir -p "$PKG/files"
          # -tags openwrt：选 procd/UCI 装配后端；通用 Linux 后端（systemd）在此构建被排除。
          go build -tags openwrt -ldflags "$LDFLAGS" -o "$PKG/files/mynet" ./cmd/mynet
          go build -tags openwrt -ldflags "$LDFLAGS" -o "$PKG/files/mynetd" ./cmd/mynetd
          file "$PKG/files/mynet" "$PKG/files/mynetd"
          strings "$PKG/files/mynet" | grep -q 'mynet.ApplyProxy' \
            || { echo "ERROR: 缺 proxy 能力"; exit 1; }

      # OpenWrt 后端（linux && openwrt）只能在 linux 上跑测；本机 darwin 只能编译。
      # 这里跑 openwrt 标签单测，覆盖 UCI 步骤首装/幂等（G-11）等。
      - name: Unit tests (openwrt backend)
        run: go test -count=1 -tags openwrt ./mynet/ ./mynet/driver/

      - name: Package via OpenWrt SDK (ipk)
        run: |
          set -euo pipefail
          SDK=/opt/openwrt-sdk/${{ env.SDK_VERSION }}/${{ matrix.sdk_name }}
          ln -sfn "$GITHUB_WORKSPACE/mynet_openwrt" "$SDK/package/mynet_openwrt"
          ls -la "$SDK/package/mynet_openwrt/Makefile"
          cd "$SDK"

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          printf '%s\n' \
            'CONFIG_PACKAGE_mynet-agent=y' \
            'CONFIG_PACKAGE_luci-app-mynet=y' >> .config
          make defconfig

          # opkg 按 version-release 判「是不是升级」：PKG_RELEASE 带上**提交计数**
          # （单调递增、同提交可复现），否则同一产品版本下 opkg 永远判定「已是最新」，
          # 升级只能靠 --force-reinstall（2026-10-11 升 .182 实测）。
          REL=$(git -C "$GITHUB_WORKSPACE" rev-list --count HEAD)
          echo "PKG_RELEASE=$REL (mynet_agent 提交数)"
          MYNET_PKG_RELEASE="$REL" make package/mynet_openwrt/compile V=s

          mkdir -p "$GITHUB_WORKSPACE/dist-ipk"
          # 只收我们自己的包，不带 feeds 全量（firmware/luci-base 等）
          find bin/packages \( -name 'mynet-agent_*.ipk' -o -name 'luci-app-mynet_*.ipk' \) \
            -exec cp -v {} "$GITHUB_WORKSPACE/dist-ipk/" \;
          echo "=== dist-ipk ==="
          ls -la "$GITHUB_WORKSPACE/dist-ipk/"
          # 空目录即失败
          [ "$(find "$GITHUB_WORKSPACE/dist-ipk" -name '*.ipk' | wc -l)" -ge 2 ]

      # O6 冻结：ctl 的 parseFilename 只认 {product}_{platform}_{arch}_{ver}.{ext}
      # （见 mynet_ctl ReleaseDomainService + tests/Unit/ReleaseFilenameTest）。
      # SDK 原生名 mynet-agent_*.ipk / luci-app-mynet_*.ipk 不在其枚举里 → 改名。
      - name: Freeze ipk names (ctl SSOT)
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/dist-ipk"
          rt=$(ls mynet-agent_*.ipk 2>/dev/null | head -1 || true)
          [ -n "$rt" ] || { echo "ERROR: 未产出 mynet-agent ipk"; exit 1; }
          mv -f "$rt" "mynet_agent_openwrt_${{ matrix.arch }}_${VER}.ipk"
          lu=$(ls luci-app-mynet_*.ipk 2>/dev/null | head -1 || true)
          [ -n "$lu" ] || { echo "ERROR: 未产出 luci-app-mynet ipk"; exit 1; }
          mv -f "$lu" "lua_openwrt_all_${VER}.ipk"
          sha256sum ./*.ipk | tee SHA256SUMS
          ls -la

      # 分发=ctl（不再用 upload-artifact：GitHub artifact 配额已耗尽）。
      # 契约：POST {CTL_URL}/api/v2/releases，multipart，Bearer token(scope=release:upload)。
      - name: Publish to ctl
        env:
          VER: ${{ steps.ver.outputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          CTL_URL: ${{ secrets.CTL_URL }}
          CTL_TOKEN: ${{ secrets.CTL_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$CTL_URL" ]   || { echo "ERROR: 缺 secrets.CTL_URL（ctl 基址）"; exit 1; }
          [ -n "$CTL_TOKEN" ] || { echo "ERROR: 缺 secrets.CTL_RELEASE_TOKEN（scope=release:upload）"; exit 1; }
          stable=0; if [ "$REF_TYPE" = "tag" ]; then stable=1; fi   # is_stable 必须发 1/0
          cd "$GITHUB_WORKSPACE/dist-ipk"
          # 幂等：ctl 的 upload 是裸 Release::create()，releases 表有
          # unique(product,version,platform,arch,variant)；同版本重推不是「跳过」而是
          # **500** —— 修好一条腿重跑整个作业，已发过的腿全撞键，publish 永久红。
          # 发前先量公开下载面 /d/<product>/<file>：200 = 已发布 → SKIP。判据与 gnb 仓的
          # .github/actions/ctl-publish 同源（那边还比了包内 MANIFEST 的来源指纹，因为 gnb 的
          # 版本号是 tag 可被重发；这里版本号是 v0.0.0-<提交sha>，同一版本必然是同一提交，
          # 所以只需「发过没发过」这一级）。
          pub() { # product platform arch file
            if [ "$(curl -sS --max-time 60 -o /dev/null -w '%{http_code}' "$CTL_URL/d/$1/$4" || echo 000)" = "200" ]; then
              echo "SKIP: $4 已在下载面（/d/$1/$4）"
              return 0
            fi
            echo "→ publish $1 $2 $3 $4 (is_stable=$stable)"
            curl -sS -f -X POST "$CTL_URL/api/v2/releases" \
              -H "Authorization: Bearer $CTL_TOKEN" \
              -F "product=$1" -F "version=${VER}" -F "platform=$2" -F "arch=$3" \
              -F "is_stable=$stable" -F "file=@$4"
            echo
          }
          pub mynet_agent openwrt "${{ matrix.arch }}" "mynet_agent_openwrt_${{ matrix.arch }}_${VER}.ipk"
          # luci-app-mynet 是 all 架构，三个腿打出的 ipk 完全同名同内容。
          # 只有 amd64 腿发布它：否则第二/三腿会撞 ctl 的唯一键
          # (product,version,platform,arch,variant)，上传 500。
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            pub lua openwrt "all" "lua_openwrt_all_${VER}.ipk"
          fi

      # 只列 ctl 索引确认。曾单起一个 `summary` runner 干这一条 curl ——
      # 空烧一分钟，且账户额度见底时「作业无法启动」会把它变成**假红**
      # （2026-10-11：3 个 ipk 腿全绿，summary 因 spending limit 未启动 → 整轮红）。
      # 折进 amd64 腿（lua 也只在该腿发），不另占 runner。
      - name: List ctl releases
        if: matrix.arch == 'amd64'
        env:
          CTL_URL: ${{ secrets.CTL_URL }}
        run: |
          {
            echo "## OpenWrt ipk（SDK 24.10 → ctl）"
            if [ -n "$CTL_URL" ]; then
              curl -sS "$CTL_URL/api/v2/releases" | head -c 4000
            else
              echo "（未配 secrets.CTL_URL，跳过）"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
