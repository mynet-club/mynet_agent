name: build-agent

# mynet_agent 产物构建（供 ctl 分发 / 升级取用）
#
# 命名 SSOT：mynet_agent_{os}_{arch}_{version}（AGENTS.md §1.5，guard C3）
# ⚠️ Go 的 mipsle 在 ctl 侧叫 mipsel —— 产物名必须用 ctl 叫法
# OpenWrt：mynetd **无 embed**（D-11 瘦构建，UI 归 LuCI）
# proxy 能力在默认编译里（mynet/proxy_*.go），无需额外 tag

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: go test
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ctlarch: amd64
            openwrt: true
          - goos: linux
            goarch: arm64
            ctlarch: arm64
            openwrt: true
          - goos: linux
            goarch: mipsle
            ctlarch: mipsel
            openwrt: true
            gomips: softfloat
          - goos: darwin
            goarch: arm64
            ctlarch: arm64
          - goos: darwin
            goarch: amd64
            ctlarch: amd64
          - goos: windows
            goarch: amd64
            ctlarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            V="${{ github.ref_name }}"
          else
            SHA=$(git describe --tags --always --dirty)
            case "$SHA" in
              v*) V="$SHA" ;;
              *)  V="v0.0.0-$SHA" ;;
            esac
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "VERSION=$V"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOMIPS: ${{ matrix.gomips }}
          CGO_ENABLED: '0'
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          NAME="mynet_agent_${GOOS}_${{ matrix.ctlarch }}_${VER}"
          OUT="dist/${NAME}"
          mkdir -p "$OUT"
          LDFLAGS="-s -w -X github.com/mynet-club/mynet_agent-V2/shared/utils.AppVersion=${VER} -X github.com/mynet-club/mynet_agent-V2/mynet.Version=${VER} -X main.version=${VER}"

          # mynet 执行器（含 proxy：proxy_*.go 默认编入）
          go build -ldflags "$LDFLAGS" -o "${OUT}/mynet${EXT}" ./cmd/mynet
          # mynetd：OpenWrt 瘦（无 embed）；非 OpenWrt 产 embed 版供桌面
          if [ "${{ matrix.openwrt }}" = "true" ]; then
            go build -ldflags "$LDFLAGS" -o "${OUT}/mynetd${EXT}" ./cmd/mynetd
          else
            go build -ldflags "$LDFLAGS" -tags embed -o "${OUT}/mynetd${EXT}" ./cmd/mynetd
          fi
          go build -ldflags "$LDFLAGS" -o "${OUT}/mynet_gateway${EXT}" ./cmd/mynet_gateway

          # sanity：proxy 符号必须在（「带 proxy 的」）
          if ! go tool nm "${OUT}/mynet${EXT}" | grep -q 'mynet.ApplyProxy'; then
            echo "ERROR: mynet 产物缺少 proxy 能力（ApplyProxy*）" >&2
            exit 1
          fi
          echo "built $NAME"
          ls -la "$OUT"

      - name: Pack
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          NAME="mynet_agent_${{ matrix.goos }}_${{ matrix.ctlarch }}_${VER}"
          if [ "${{ matrix.goos }}" = "darwin" ] || [ "${{ matrix.goos }}" = "windows" ]; then
            (cd dist && zip -r "${NAME}.zip" "${NAME}")
          else
            (cd dist && tar czf "${NAME}.tgz" "${NAME}")
          fi
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: mynet_agent_${{ matrix.goos }}_${{ matrix.ctlarch }}
          path: |
            dist/*.tgz
            dist/*.zip
          if-no-files-found: error

  openwrt-meta:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List upgrade artifacts
        run: |
          echo "## OpenWrt 升级可用产物" >> "$GITHUB_STEP_SUMMARY"
          find artifacts -type f | tee -a "$GITHUB_STEP_SUMMARY"
