name: build-agent

# mynet_agent 产物构建（供 ctl 分发 / 升级取用）
#
# 命名 SSOT：mynet_agent_{os}_{arch}_{version}（AGENTS.md §1.5，guard C3）
# ⚠️ Go 的 mipsle 在 ctl 侧叫 mipsel —— 产物名必须用 ctl 叫法
# 桌面/服务器（linux/darwin/windows）：mynetd **embed** WebUI（与 `make dist` 一致）
# OpenWrt：**不走本工作流** —— 其瘦构建（`-tags openwrt`、无 embed、procd 后端）由
#          `build_openwrt.yml` 出 ipk；本工作流不再产出"伪装成 linux 的 OpenWrt 包"。
# proxy 能力在默认编译里（mynet/proxy_*.go），无需额外 tag

# ⚠️ 触发面：**只 tag + 手动 + PR**，不跟 push:main。
# 六腿构建与 ctl 分发按需跑；PR 运行测试。GUI/desktop ref 显式指定，
# tag 触发使用同名 tag，缺失直接失败。实际 SHA 随包记录于 SOURCES.txt。
on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      gui_ref:
        description: 'mynet_gui commit SHA/tag (required; no default-branch fallback)'
        required: true
        type: string
      desktop_ref:
        description: 'mynet_desktop commit SHA/tag for darwin installation docs'
        required: true
        type: string

# 同一 ref 的并发运行取消旧的（重复 dispatch 不叠加）；tag 出包不取消（防半截发布）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: go test
        run: go test ./...

  build:
    needs: test
    # PR 只跑 test（便宜、能挡坏东西）；平台矩阵交叉编译只在 tag/手动跑 —— 省额度。
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ctlarch: amd64
          - goos: linux
            goarch: arm64
            ctlarch: arm64
          - goos: linux
            goarch: mipsle
            ctlarch: mipsel
            gomips: softfloat
          - goos: darwin
            goarch: arm64
            ctlarch: arm64
          - goos: darwin
            goarch: amd64
            ctlarch: amd64
          - goos: freebsd
            goarch: amd64
            ctlarch: amd64
          - goos: freebsd
            goarch: arm64
            ctlarch: arm64
          - goos: openbsd
            goarch: amd64
            ctlarch: amd64
          - goos: openbsd
            goarch: arm64
            ctlarch: arm64
          - goos: windows
            goarch: amd64
            ctlarch: amd64
    steps:
      - uses: actions/checkout@v4
      - name: Resolve source refs
        id: sources
        env:
          GUI_INPUT: ${{ inputs.gui_ref }}
          DESKTOP_INPUT: ${{ inputs.desktop_ref }}
        run: |
          set -euo pipefail
          gui_ref="$GUI_INPUT"
          desktop_ref="$DESKTOP_INPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            gui_ref="${gui_ref:-$GITHUB_REF_NAME}"
            desktop_ref="${desktop_ref:-$GITHUB_REF_NAME}"
          fi
          [ -n "$gui_ref" ] || { echo 'GUI ref required' >&2; exit 1; }
          [ -n "$desktop_ref" ] || { echo 'desktop ref required' >&2; exit 1; }
          echo "gui_ref=$gui_ref" >> "$GITHUB_OUTPUT"
          echo "desktop_ref=$desktop_ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: mynet-club/mynet_gui
          ref: ${{ steps.sources.outputs.gui_ref }}
          path: mynet_gui
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mynet_gui/package-lock.json
      - name: Build embedded GUI
        working-directory: mynet_gui
        run: |
          set -euo pipefail
          npm ci
          cp .env.embed .env.prod
          cp .env.embed .env.local.prod
          npm run build
      - name: Prepare embedded GUI
        run: sh scripts/prepare-gui.sh mynet_gui/dist/spa mynetd/localapi/webui/gui
      # darwin 的安装文档归 mynet_desktop（旧 packaging/darwin 已退役）—— Pack 步取其 docs/INSTALL.md
      - uses: actions/checkout@v4
        if: matrix.goos == 'darwin'
        with:
          repository: mynet-club/mynet_desktop
          ref: ${{ steps.sources.outputs.desktop_ref }}
          path: mynet_desktop
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            V="${{ github.ref_name }}"
          else
            # 短 sha，不要 `git describe`：全历史/近 tag 时会给出 v0.1.2-20-g<sha>
            # 这种**两个连字符**的形式，ctl 的 validateVersion 只允许一个 [.\-]
            # 后缀段 → 上传被判无效版本号回 500（2026-10-11 实测）。
            SHA=$(git rev-parse --short HEAD)
            V="v0.0.0-$SHA"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "VERSION=$V"

      - name: Verify embedded UI over HTTP
        run: go run -tags embed scripts/check-embedded-ui.go

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOMIPS: ${{ matrix.gomips }}
          CGO_ENABLED: '0'
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          NAME="mynet_agent_${GOOS}_${{ matrix.ctlarch }}_${VER}"
          OUT="dist/${NAME}"
          mkdir -p "$OUT"
          source_desktop=-
          if [ "$GOOS" = darwin ]; then source_desktop=mynet_desktop; fi
          sh scripts/build-sources.sh . mynet_gui mynet_gui/dist/spa "$source_desktop" "$OUT/SOURCES.txt"
          # B4 版本戳：基线 / 补丁 / 构建者（mynet version 三句话）
          GNB_BASELINE="1.6.8-c411f14ee647"
          GNB_PATCHES="p1-hot-restart-v2,p2-route-proxy"
          # ⚠️ 不得含空格 —— -ldflags 按空格拆参数
          BUILD_INFO="ci@gh-actions_$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w \
            -X github.com/mynet-club/mynet_agent/shared/utils.AppVersion=${VER} \
            -X github.com/mynet-club/mynet_agent/shared/utils.GnbBaseline=${GNB_BASELINE} \
            -X github.com/mynet-club/mynet_agent/shared/utils.GnbPatchStack=${GNB_PATCHES} \
            -X github.com/mynet-club/mynet_agent/shared/utils.BuildStamp=${BUILD_INFO} \
            -X github.com/mynet-club/mynet_agent/mynet.Version=${VER} \
            -X main.version=${VER}"

          # mynet 执行器（含 proxy：proxy_*.go 默认编入）
          go build -ldflags "$LDFLAGS" -o "${OUT}/mynet${EXT}" ./cmd/mynet
          # mynetd：桌面/服务器发行一律 embed WebUI（与 make dist 一致）。
          # OpenWrt 不走本工作流 —— 其瘦构建由 build_openwrt.yml 的 `-tags openwrt` ipk 承担。
          go build -ldflags "$LDFLAGS" -tags embed -o "${OUT}/mynetd${EXT}" ./cmd/mynetd
          # 客户端包**不含** mynet_gateway（服务端组件，不进用户安装包）

          # sanity：proxy 能力必须在（「带 proxy 的」）
          # -s -w 会剥符号表，不能用 go tool nm；改查运行时类型名/字符串面
          if ! strings "${OUT}/mynet${EXT}" | grep -q 'mynet.ApplyProxy'; then
            echo "ERROR: mynet 产物缺少 proxy 能力（ApplyProxy*）" >&2
            exit 1
          fi
          # B4：版本戳三句话必须在
          if ! strings "${OUT}/mynet${EXT}" | grep -q "$GNB_BASELINE"; then
            echo "ERROR: 产物缺 GnbBaseline 版本戳" >&2
            exit 1
          fi
          echo "built $NAME"
          ls -la "$OUT"

      - name: Pack
        env:
          VER: ${{ steps.ver.outputs.version }}
          GOOS: ${{ matrix.goos }}
        run: |
          set -euo pipefail
          NAME="mynet_agent_${{ matrix.goos }}_${{ matrix.ctlarch }}_${VER}"
          OUT="dist/${NAME}"
          # 分平台 INSTALL.md 是产物一部分（pack.sh 强制校验）。
          # darwin 安装文档来自固定 desktop ref。
          DOC="packaging/${GOOS}/INSTALL.md"
          if [ "$GOOS" = "darwin" ]; then DOC="mynet_desktop/docs/INSTALL.md"; fi
          if [ -f "$DOC" ]; then
            cp "$DOC" "$OUT/INSTALL.md"
          else
            echo "ERROR: 缺 $DOC" >&2
            exit 1
          fi
          sh scripts/pack.sh "$OUT"
          ls -la dist/

      # 分发=ctl（不再用 upload-artifact：GitHub artifact 配额已耗尽）。
      # 契约：POST {CTL_URL}/api/v2/releases，multipart，Bearer token(scope=release:upload)。
      # 产物名已是 ctl SSOT（mynet_agent_<platform>_<arch>_<ver>.{tgz,zip}），无需改名。
      - name: Publish to ctl
        env:
          VER: ${{ steps.ver.outputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          CTL_URL: ${{ secrets.CTL_URL }}
          CTL_TOKEN: ${{ secrets.CTL_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$CTL_URL" ]   || { echo "ERROR: 缺 secrets.CTL_URL（ctl 基址）"; exit 1; }
          [ -n "$CTL_TOKEN" ] || { echo "ERROR: 缺 secrets.CTL_RELEASE_TOKEN（scope=release:upload）"; exit 1; }
          stable=0; if [ "$REF_TYPE" = "tag" ]; then stable=1; fi   # is_stable 必须发 1/0
          # ⚠️ 不要 `f=$(ls dist/*.tgz dist/*.zip | head -1)`：两个 glob 必有一个不匹配，
          #    `ls` 退 2，配 `set -o pipefail` 会让整个 publish 步以 exit 2 失败（实测）。
          shopt -s nullglob
          files=(dist/*.tgz dist/*.zip)
          if [ "${#files[@]}" -eq 0 ]; then echo "ERROR: dist 下无产物"; exit 1; fi
          f="${files[0]}"
          base="$(basename "$f")"
          # Immutable versions may only be skipped when their source and GUI
          # asset provenance agrees. Agent SHA alone does not identify the GUI.
          existing=$(mktemp)
          trap 'rm -f "$existing"' EXIT
          status=$(curl -sS --max-time 120 -o "$existing" -w '%{http_code}' "$CTL_URL/d/mynet_agent/$base")
          if [ "$status" = 200 ]; then
            sh scripts/check-package-sources.sh "$existing" "$base" "dist/${base%.*}/SOURCES.txt"
            echo "SKIP: $base 已在下载面（/d/mynet_agent/$base）"
          elif [ "$status" = 404 ]; then
            echo "→ publish mynet_agent ${{ matrix.goos }} ${{ matrix.ctlarch }} $f (is_stable=$stable)"
            curl -sS -f -X POST "$CTL_URL/api/v2/releases" \
              -H "Authorization: Bearer $CTL_TOKEN" \
              -F "product=mynet_agent" -F "version=${VER}" \
              -F "platform=${{ matrix.goos }}" -F "arch=${{ matrix.ctlarch }}" \
              -F "is_stable=$stable" -F "file=@$f"
          else
            echo "ERROR: 下载探针 HTTP $status，停止发布" >&2
            exit 1
          fi
          echo

