name: build-agent

# mynet_agent 产物构建（供 ctl 分发 / 升级取用）
#
# 命名 SSOT：mynet_agent_{os}_{arch}_{version}（AGENTS.md §1.5，guard C3）
# ⚠️ Go 的 mipsle 在 ctl 侧叫 mipsel —— 产物名必须用 ctl 叫法
# 桌面/服务器（linux/darwin/windows）：mynetd **embed** WebUI（与 `make dist` 一致）
# OpenWrt：**不走本工作流** —— 其瘦构建（`-tags openwrt`、无 embed、procd 后端）由
#          `build_openwrt.yml` 出 ipk；本工作流不再产出"伪装成 linux 的 OpenWrt 包"。
# proxy 能力在默认编译里（mynet/proxy_*.go），无需额外 tag

# ⚠️ 触发面：**只 tag + 手动 + PR**，不跟 push:main。
# 本工作流的 build 矩阵是 6 腿交叉编译 + upload-artifact，而 GitHub Artifact 存储
# 配额已耗尽（upload-artifact 报 "Artifact storage quota has been hit"），
# push:main 触发的每次运行都**只烧分钟、拿不到产物**（红）。出包按需跑；
# PR 仍跑（test 便宜、且能挡坏东西）。
on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: go test
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ctlarch: amd64
          - goos: linux
            goarch: arm64
            ctlarch: arm64
          - goos: linux
            goarch: mipsle
            ctlarch: mipsel
            gomips: softfloat
          - goos: darwin
            goarch: arm64
            ctlarch: arm64
          - goos: darwin
            goarch: amd64
            ctlarch: amd64
          - goos: windows
            goarch: amd64
            ctlarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            V="${{ github.ref_name }}"
          else
            SHA=$(git describe --tags --always --dirty)
            case "$SHA" in
              v*) V="$SHA" ;;
              *)  V="v0.0.0-$SHA" ;;
            esac
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "VERSION=$V"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOMIPS: ${{ matrix.gomips }}
          CGO_ENABLED: '0'
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          NAME="mynet_agent_${GOOS}_${{ matrix.ctlarch }}_${VER}"
          OUT="dist/${NAME}"
          mkdir -p "$OUT"
          # B4 版本戳：基线 / 补丁 / 构建者（mynet version 三句话）
          GNB_BASELINE="1.6.8-c411f14ee647"
          GNB_PATCHES="p1-hot-restart-v2,p2-route-proxy"
          # ⚠️ 不得含空格 —— -ldflags 按空格拆参数
          BUILD_INFO="ci@gh-actions_$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w \
            -X github.com/mynet-club/mynet_agent/shared/utils.AppVersion=${VER} \
            -X github.com/mynet-club/mynet_agent/shared/utils.GnbBaseline=${GNB_BASELINE} \
            -X github.com/mynet-club/mynet_agent/shared/utils.GnbPatchStack=${GNB_PATCHES} \
            -X github.com/mynet-club/mynet_agent/shared/utils.BuildStamp=${BUILD_INFO} \
            -X github.com/mynet-club/mynet_agent/mynet.Version=${VER} \
            -X main.version=${VER}"

          # mynet 执行器（含 proxy：proxy_*.go 默认编入）
          go build -ldflags "$LDFLAGS" -o "${OUT}/mynet${EXT}" ./cmd/mynet
          # mynetd：桌面/服务器发行一律 embed WebUI（与 make dist 一致）。
          # OpenWrt 不走本工作流 —— 其瘦构建由 build_openwrt.yml 的 `-tags openwrt` ipk 承担。
          go build -ldflags "$LDFLAGS" -tags embed -o "${OUT}/mynetd${EXT}" ./cmd/mynetd
          # 客户端包**不含** mynet_gateway（服务端组件，不进用户安装包）

          # sanity：proxy 能力必须在（「带 proxy 的」）
          # -s -w 会剥符号表，不能用 go tool nm；改查运行时类型名/字符串面
          if ! strings "${OUT}/mynet${EXT}" | grep -q 'mynet.ApplyProxy'; then
            echo "ERROR: mynet 产物缺少 proxy 能力（ApplyProxy*）" >&2
            exit 1
          fi
          # B4：版本戳三句话必须在
          if ! strings "${OUT}/mynet${EXT}" | grep -q "$GNB_BASELINE"; then
            echo "ERROR: 产物缺 GnbBaseline 版本戳" >&2
            exit 1
          fi
          echo "built $NAME"
          ls -la "$OUT"

      - name: Pack
        env:
          VER: ${{ steps.ver.outputs.version }}
          GOOS: ${{ matrix.goos }}
        run: |
          set -euo pipefail
          NAME="mynet_agent_${{ matrix.goos }}_${{ matrix.ctlarch }}_${VER}"
          OUT="dist/${NAME}"
          # 分平台 INSTALL.md 是产物一部分（pack.sh 强制校验）
          if [ -f "packaging/${GOOS}/INSTALL.md" ]; then
            cp "packaging/${GOOS}/INSTALL.md" "$OUT/INSTALL.md"
          else
            echo "ERROR: 缺 packaging/${GOOS}/INSTALL.md" >&2
            exit 1
          fi
          if [ "${{ matrix.goos }}" = "darwin" ] || [ "${{ matrix.goos }}" = "windows" ]; then
            (cd dist && zip -r "${NAME}.zip" "${NAME}")
          else
            (cd dist && tar czf "${NAME}.tgz" "${NAME}")
          fi
          ls -la dist/

      # 分发=ctl（不再用 upload-artifact：GitHub artifact 配额已耗尽）。
      # 契约：POST {CTL_URL}/api/v2/releases，multipart，Bearer token(scope=release:upload)。
      # 产物名已是 ctl SSOT（mynet_agent_<platform>_<arch>_<ver>.{tgz,zip}），无需改名。
      - name: Publish to ctl
        env:
          VER: ${{ steps.ver.outputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          CTL_URL: ${{ secrets.CTL_URL }}
          CTL_TOKEN: ${{ secrets.CTL_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$CTL_URL" ]   || { echo "ERROR: 缺 secrets.CTL_URL（ctl 基址）"; exit 1; }
          [ -n "$CTL_TOKEN" ] || { echo "ERROR: 缺 secrets.CTL_RELEASE_TOKEN（scope=release:upload）"; exit 1; }
          stable=0; if [ "$REF_TYPE" = "tag" ]; then stable=1; fi   # is_stable 必须发 1/0
          # ⚠️ 不要 `f=$(ls dist/*.tgz dist/*.zip | head -1)`：两个 glob 必有一个不匹配，
          #    `ls` 退 2，配 `set -o pipefail` 会让整个 publish 步以 exit 2 失败（实测）。
          shopt -s nullglob
          files=(dist/*.tgz dist/*.zip)
          if [ "${#files[@]}" -eq 0 ]; then echo "ERROR: dist 下无产物"; exit 1; fi
          f="${files[0]}"
          echo "→ publish mynet_agent ${{ matrix.goos }} ${{ matrix.ctlarch }} $f (is_stable=$stable)"
          curl -sS -f -X POST "$CTL_URL/api/v2/releases" \
            -H "Authorization: Bearer $CTL_TOKEN" \
            -F "product=mynet_agent" -F "version=${VER}" \
            -F "platform=${{ matrix.goos }}" -F "arch=${{ matrix.ctlarch }}" \
            -F "is_stable=$stable" -F "file=@$f"
          echo

